<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ .Site.Title }}</title>
<style>
body{margin:0;font-family:"Open Sans",Arial,sans-serif;color:#444;line-height:1.6}
nav{background:#f4f4f4;padding:10px 20px;font-weight:bold}
nav a{color:#0b7285;text-decoration:none}
main{max-width:650px;margin:0 auto;padding:20px}
h1.title{font-size:64px;text-align:center;margin:30px 0}
.intro{background:#f4f4f4;border:1px solid #e5e5e5;padding:5px 20px;margin-bottom:30px}
.intro h1{font-size:20px}
h2{font-size:26px;margin-bottom:5px}
h2 a{color:#444;text-decoration:none}
.meta{font-style:italic;color:#777;margin:0}
.tags a{color:#0b7285;margin-right:8px}
footer{background:#f4f4f4;text-align:center;padding:20px;margin-top:60px;color:#777}
</style>
</head>
<body>
<nav><a href="{{ "/" | relURL }}">{{ .Site.Title }}</a></nav>
<main>
{{ block "main" . }}{{ end }}
</main>
<footer>Onur Yilmaz &middot; &copy; 2019 &middot; DevOps Blog</footer>
</body>
</html>
